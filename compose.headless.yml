services:
  omarchy:
    build:
      context: .
      args:
        OMARCHY_CHANNEL: ${OMARCHY_CHANNEL:-stable}
        OMARCHY_PROFILE: ${OMARCHY_PROFILE:-core}
    image: local/omarchy-headless:latest
    container_name: omarchy
    hostname: omarchy
    restart: unless-stopped
    runtime: nvidia
    cgroup: host
    network_mode: host
    privileged: true
    environment:
      OMARCHY_INPUT_MODE: headless
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: all
      WLR_RENDERER: ${WLR_RENDERER:-gles2}
      WLR_LIBINPUT_NO_DEVICES: ${WLR_LIBINPUT_NO_DEVICES:-1}
      OMARCHY_OUTPUT_NAME: ${OMARCHY_OUTPUT_NAME:-OMARCHY}
      OMARCHY_RESOLUTION: ${OMARCHY_RESOLUTION:-2560x1440}
      OMARCHY_REFRESH: ${OMARCHY_REFRESH:-60}
      OMARCHY_SCALE: ${OMARCHY_SCALE:-1}
      SUNSHINE_PORT: ${SUNSHINE_PORT:-47989}
      SUNSHINE_NAME: ${SUNSHINE_NAME:-Omarchy}
      SUNSHINE_CSRF_ALLOWED_ORIGINS: ${SUNSHINE_CSRF_ALLOWED_ORIGINS:-}
      SUNSHINE_SEAT: ${SUNSHINE_SEAT:-seat9}
      AQ_DRM_DEVICES: ${AQ_DRM_DEVICES:-}
    volumes:
      - ${APPDATA_PATH:-./appdata/omarchy-docker}/home:/home/omarchy
      - ${APPDATA_PATH:-./appdata/omarchy-docker}/sunshine:/config
      - /run/udev:/run/udev:ro
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    tmpfs: [/run, /run/lock, /tmp:exec]
    healthcheck:
      test: ["CMD-SHELL", "runuser -u omarchy -- env XDG_RUNTIME_DIR=/run/user/1000 DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/1000/bus systemctl --user is-active --quiet omarchy-sunshine.service"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 3
